name: Scan TODOs to Linear

on:
  push:
    branches: [ main, dev ]

jobs:
  create-issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for TODOs and Create Linear Tickets
        uses: linear/linear-action@v1
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        with:
          team-id: 'MAR'
